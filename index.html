<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>최저가 레이더</title>
<meta name="theme-color" content="#14363a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 좁은 화면(커버)=탭 1열, 넓은 화면(펼침·탭·PC)=검색 | 찜 2열 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#132a2d; --muted:#5c6f71; --line:#d9e1e0;
  --brand:#14363a; --brand-ink:#ffffff; --accent:#0f7c72; --tag:#ffd84d; --tag-ink:#3b2d00;
  --down:#0f7c72; --up:#c2412d;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1617; --surface:#162224; --ink:#e4eceb; --muted:#93a6a7; --line:#27393b;
  --brand:#0b2124; --brand-ink:#e4eceb; --accent:#4fc2b5; --tag:#f5cf3d; --tag-ink:#2a2000;
  --down:#4fc2b5; --up:#ef7a64; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{background:var(--brand);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-bottom:10px}
.brand .tagmark{background:var(--tag);color:var(--tag-ink);font:600 11px var(--f-num);padding:2px 6px;border-radius:3px;letter-spacing:.04em}
form.search{display:flex;gap:8px}
form.search input{flex:1;min-width:0;border:0;border-radius:10px;padding:12px 14px;font-size:16px;background:#fff;color:#132a2d}
form.search button{border:0;border-radius:10px;padding:0 18px;background:var(--tag);color:var(--tag-ink);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--brand-ink);border-radius:999px;padding:3px 10px;font-size:13px}
.chip.fav{border-color:var(--tag);color:var(--tag)}
.chip .x{opacity:.6;padding-left:2px}
.chip-label{font-size:12px;opacity:.7;align-self:center}

main{display:grid;gap:16px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));max-width:1280px;margin:0 auto}
section.panel{min-width:0;display:none;flex-direction:column;gap:14px}
body.v-search #search, body.v-wish #wish, body.v-settings #settings{display:flex}
@media (min-width:720px){
  main{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
  body.v-search #wish, body.v-wish #search{display:flex}
  body.v-settings #wish{display:flex}
  body.v-wish #search{grid-column:1;grid-row:1} body.v-wish #wish{grid-column:2;grid-row:1}
  #wish{position:sticky;top:12px}
}
h2{font-size:15px;margin:0;font-weight:700}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}

.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.site{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.site b{font-size:14px}
.site span{font-size:11px;color:var(--muted)}
.site[aria-disabled="true"]{opacity:.45;pointer-events:none}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

.summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pricetag{background:var(--tag);color:var(--tag-ink);font:600 15px var(--f-num);padding:2px 8px;border-radius:4px;font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--line)}
.item .t{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);text-decoration:none}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.item .p{font:600 15px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.lowest .p{background:var(--tag);color:var(--tag-ink);padding:1px 6px;border-radius:4px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.heart{border:1px solid var(--line);background:transparent;border-radius:8px;width:34px;height:30px;font-size:15px;line-height:1}
.heart[aria-pressed="true"]{color:var(--up);border-color:var(--up)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--up)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}

.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}
.wcard img,.wcard .noimg{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--line)}
.wcard .t{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.wprice{font:600 16px var(--f-num);font-variant-numeric:tabular-nums}
.delta{font:500 12px var(--f-num)}
.delta.down{color:var(--down)} .delta.up{color:var(--up)}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.pill.hit{background:var(--tag);color:var(--tag-ink);border-color:var(--tag);font-weight:700}
.wfoot{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wfoot input{width:110px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);font-size:13px}
svg.spark{width:100%;height:34px;grid-column:1/-1;display:block}
.hist{grid-column:1/-1;font-size:12px;color:var(--muted);max-height:140px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
.hist div{display:flex;justify-content:space-between}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow span{flex:1}
.switch{appearance:none;width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch:checked{background:var(--accent)} .switch:checked::after{left:21px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 0 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:700}
nav.tabs .ico{font-size:18px;line-height:1}
.badge{font:600 10px var(--f-num);background:var(--up);color:#fff;border-radius:999px;padding:0 5px;margin-left:2px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.on{opacity:1}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="v-search">
<header class="top">
  <div class="brand"><span class="tagmark">₩ LOW</span>최저가 레이더</div>
  <form class="search" id="f">
    <input id="q" type="search" placeholder="찾을 상품 (예: 다이슨 V15, 생수 2L)" autocomplete="off" enterkeyhint="search">
    <button type="submit">검색</button>
  </form>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section class="panel" id="search">
    <div class="sec-head"><h2>사이트별 바로 열기</h2><span class="sub" id="siteHint">검색어를 넣으면 각 사이트 검색 결과가 열립니다</span></div>
    <div class="sites" id="sites"></div>

    <div class="sec-head">
      <h2>최저가 목록 <span class="sub">네이버쇼핑 가격비교</span></h2>
      <div class="seg" id="sort">
        <button data-s="sim" aria-pressed="true">정확도</button>
        <button data-s="asc">낮은가격</button>
        <button data-s="dsc">높은가격</button>
        <button data-s="date">최신</button>
      </div>
    </div>
    <div id="results"></div>
  </section>

  <section class="panel" id="wish">
    <div class="sec-head">
      <h2>찜 · 가격 기록 <span class="sub" id="wishCount"></span></h2>
      <button class="btn small primary" id="refreshAll">가격 새로고침</button>
    </div>
    <div class="sub" id="lastRefresh"></div>
    <div id="wishList" style="display:flex;flex-direction:column;gap:10px"></div>
    <details class="card">
      <summary style="cursor:pointer;font-weight:700;font-size:14px">직접 찜 추가 (쿠팡·알리 등 목록에 없는 상품)</summary>
      <form id="manual" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <div class="field"><label for="mName">상품명</label><input id="mName" required></div>
        <div class="row">
          <div class="field" style="flex:1"><label for="mPrice">지금 가격(원)</label><input id="mPrice" inputmode="numeric" required></div>
          <div class="field" style="flex:1"><label for="mMall">쇼핑몰</label><input id="mMall" placeholder="쿠팡"></div>
        </div>
        <div class="field"><label for="mLink">상품 링크 (선택)</label><input id="mLink" type="url" placeholder="https://"></div>
        <button class="btn primary" type="submit">찜에 추가</button>
      </form>
    </details>
  </section>

  <section class="panel" id="settings">
    <div class="card">
      <h2>최저가 목록 연결</h2>
      <div class="field"><label for="wUrl">중계서버 주소 (Cloudflare Worker)</label>
        <input id="wUrl" type="url" placeholder="https://shop-proxy.이름.workers.dev"></div>
      <div class="row"><button class="btn primary" id="wSave">저장하고 연결 확인</button><span class="sub" id="wStatus"></span></div>
      <label class="row" style="font-size:14px"><input type="checkbox" class="switch" id="exclude"> 해외직구·중고·렌탈 상품 빼기</label>
      <label class="row" style="font-size:14px"><input type="checkbox" class="switch" id="autoRefresh"> 앱을 열 때 하루 한 번 찜 가격 자동 갱신</label>
    </div>
    <div class="card">
      <h2>사이트 켜기·끄기·순서</h2>
      <div id="siteSet"></div>
    </div>
    <div class="card">
      <h2>백업</h2>
      <p class="sub" style="margin:0">찜·가격 기록은 이 기기에만 저장됩니다. 폰과 탭에서 같이 쓰려면 내보낸 파일을 다른 기기에서 가져오세요.</p>
      <div class="row">
        <button class="btn" id="exportBtn">백업 파일 저장</button>
        <label class="btn" for="importFile">백업 불러오기</label>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </div>
    <div class="card">
      <h2>홈 화면에 설치</h2>
      <p class="sub" style="margin:0">크롬 메뉴(⋮) → <b>홈 화면에 추가 → 설치</b>. 설치하면 쿠팡·네이버 앱의 <b>공유 → 최저가 레이더</b>로 상품명을 바로 보내 검색할 수 있습니다.</p>
    </div>
  </section>
</main>

<nav class="tabs" id="tabs">
  <button data-v="search" aria-current="true"><span class="ico">⌕</span>검색</button>
  <button data-v="wish"><span class="ico">♡</span><span>찜<span id="tabBadge"></span></span></button>
  <button data-v="settings"><span class="ico">⚙</span>설정</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
const SITES = {
  coupang:{name:'쿠팡',tag:'로켓배송',url:q=>'https://www.coupang.com/np/search?q='+enc(q)},
  naver:{name:'네이버쇼핑',tag:'가격비교',url:q=>'https://search.shopping.naver.com/search/all?query='+enc(q)},
  st11:{name:'11번가',tag:'오픈마켓',url:q=>'https://search.11st.co.kr/Search.tmall?kwd='+enc(q)},
  gmarket:{name:'G마켓',tag:'오픈마켓',url:q=>'https://www.gmarket.co.kr/n/search?keyword='+enc(q)},
  auction:{name:'옥션',tag:'오픈마켓',url:q=>'https://www.auction.co.kr/n/search?keyword='+enc(q)},
  ali:{name:'알리익스프레스',tag:'해외직구',url:q=>'https://ko.aliexpress.com/wholesale?SearchText='+enc(q)},
  temu:{name:'테무',tag:'해외직구',url:q=>'https://www.temu.com/kr/search_result.html?search_key='+enc(q)},
  musinsa:{name:'무신사',tag:'패션',url:q=>'https://www.musinsa.com/search/goods?keyword='+enc(q)}
};
const enc = encodeURIComponent;
const KEY = 'lowradar.v1';
const $ = s => document.querySelector(s);
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const today = () => new Date().toLocaleDateString('sv-SE');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s => String(s ?? '').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");

let S = {
  worker:'', exclude:true, autoRefresh:true, lastAuto:'', lastRefresh:'',
  sites:Object.keys(SITES).map(id=>({id,on:true})),
  recent:[], fav:[], wish:[]
};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
// 새로 추가된 사이트 반영
Object.keys(SITES).forEach(id => { if(!S.sites.some(s=>s.id===id)) S.sites.push({id,on:true}); });
S.sites = S.sites.filter(s => SITES[s.id]);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

let query = '', sort = 'sim', start = 1, items = [], total = 0, loading = false;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- 화면 전환 ---------- */
function setView(v){
  document.body.className = 'v-'+v;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.v===v));
  if (v==='settings') renderSettings();
  window.scrollTo({top:0});
}
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.v); });

/* ---------- 검색어 칩 ---------- */
function renderChips(){
  const c = $('#chips'); let h = '';
  if (S.fav.length) h += '<span class="chip-label">★ 자주 사는</span>' + S.fav.map(k=>`<button class="chip fav" data-q="${esc(k)}">${esc(k)}</button>`).join('');
  if (S.recent.length) h += '<span class="chip-label">최근</span>' + S.recent.map(k=>`<button class="chip" data-q="${esc(k)}">${esc(k)}<span class="x" data-del="${esc(k)}" aria-label="삭제">×</span></button>`).join('');
  if (query) {
    const isFav = S.fav.includes(query);
    h += `<button class="chip fav" data-togglefav="1">${isFav?'★ 즐겨찾기 해제':'☆ “'+esc(query)+'” 즐겨찾기'}</button>`;
  }
  c.innerHTML = h;
}
$('#chips').addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if (del){ S.recent = S.recent.filter(k=>k!==del.dataset.del); save(); renderChips(); return; }
  if (e.target.closest('[data-togglefav]')){
    S.fav = S.fav.includes(query) ? S.fav.filter(k=>k!==query) : [query, ...S.fav].slice(0,12);
    save(); renderChips(); toast(S.fav.includes(query)?'자주 사는 품목에 추가했습니다':'즐겨찾기에서 뺐습니다'); return;
  }
  const b = e.target.closest('[data-q]'); if (b) runSearch(b.dataset.q);
});

/* ---------- 사이트 바로가기 ---------- */
function renderSites(){
  const on = S.sites.filter(s=>s.on);
  $('#sites').innerHTML = on.map(s=>{
    const d = SITES[s.id];
    return `<a class="site" target="_blank" rel="noopener" href="${query?esc(d.url(query)):'#'}" aria-disabled="${!query}"><b>${d.name}</b><span>${d.tag}</span></a>`;
  }).join('') || '<div class="sub">설정에서 사이트를 켜 주세요</div>';
  $('#siteHint').textContent = query ? `“${query}” 검색 결과를 각 사이트에서 엽니다` : '검색어를 넣으면 각 사이트 검색 결과가 열립니다';
}

/* ---------- 네이버 최저가 API ---------- */
async function api(q, opt={}){
  if (!S.worker) throw new Error('noworker');
  const p = new URLSearchParams({query:q, display:opt.display||40, start:opt.start||1, sort:opt.sort||'sim'});
  if (S.exclude) p.set('exclude','used:rental:cbshop');
  const r = await fetch(S.worker.replace(/\/+$/,'') + '/?' + p);
  if (!r.ok) throw new Error('http'+r.status);
  return r.json();
}

async function runSearch(q){
  q = (q||'').trim(); if (!q) return;
  query = q; $('#q').value = q;
  S.recent = [q, ...S.recent.filter(k=>k!==q)].slice(0,10); save();
  renderChips(); renderSites(); setView('search');
  start = 1; items = []; total = 0;
  await loadResults();
}

async function loadResults(more){
  const box = $('#results');
  if (!S.worker){
    box.innerHTML = `<div class="note"><b>최저가 목록을 보려면 중계서버 연결이 필요합니다.</b><br>설정 → 중계서버 주소를 넣으면 여러 쇼핑몰 가격이 여기에 모입니다. 그 전에도 위 사이트 버튼은 바로 쓸 수 있습니다.<div style="margin-top:10px"><button class="btn primary" onclick="setView('settings')">설정 열기</button></div></div>`;
    return;
  }
  if (loading) return; loading = true;
  if (!more) box.innerHTML = '<div class="empty">가격을 모으는 중…</div>';
  try{
    const d = await api(query, {start, sort});
    total = d.total || 0;
    items = more ? items.concat(d.items||[]) : (d.items||[]);
    renderResults();
  }catch(err){
    box.innerHTML = `<div class="note"><b>최저가 목록을 불러오지 못했습니다.</b><br>${err.message==='http401'||err.message==='http403'?'네이버 API 키가 맞지 않습니다. Worker의 NAVER_ID·NAVER_SECRET 값을 확인하세요.':'인터넷 연결이나 중계서버 주소를 확인한 뒤 다시 검색해 주세요.'}</div>`;
  }finally{ loading = false; }
}

function renderResults(){
  const box = $('#results');
  if (!items.length){ box.innerHTML = '<div class="empty">검색 결과가 없습니다. 검색어를 조금 짧게 바꿔 보세요.</div>'; return; }
  const prices = items.map(i=>+i.lprice).filter(Boolean);
  const min = Math.min(...prices);
  const minItem = items.find(i=>+i.lprice===min);
  const malls = new Set(items.map(i=>i.mallName)).size;
  let h = `<div class="summary"><span class="sub">보이는 ${items.length}개 중 최저</span><span class="pricetag">${won(min)}</span><span class="sub">${esc(minItem?.mallName||'')} · 쇼핑몰 ${malls}곳 · 전체 ${total.toLocaleString()}건 · 배송비 별도</span></div>`;
  h += '<div class="list">' + items.map((it,i)=>{
    const id = wishId(it);
    const saved = S.wish.some(w=>w.id===id);
    return `<div class="item ${+it.lprice===min?'lowest':''}">
      <img src="${esc(it.image)}" alt="" loading="lazy">
      <div style="min-width:0"><a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(strip(it.title))}</a>
        <div class="meta">${esc(it.mallName)}${it.brand?' · '+esc(it.brand):''}</div></div>
      <div class="right"><span class="p">${won(it.lprice)}</span>
        <button class="heart" data-i="${i}" aria-pressed="${saved}" aria-label="찜">${saved?'♥':'♡'}</button></div>
    </div>`;
  }).join('') + '</div>';
  if (items.length < Math.min(total, 1000)) h += '<button class="btn" id="more" style="align-self:center">더 보기</button>';
  box.innerHTML = h;
}
$('#results').addEventListener('click', e=>{
  if (e.target.id==='more'){ start += 40; loadResults(true); return; }
  const b = e.target.closest('.heart'); if (!b) return;
  const it = items[+b.dataset.i]; const id = wishId(it);
  if (S.wish.some(w=>w.id===id)){ S.wish = S.wish.filter(w=>w.id!==id); toast('찜에서 뺐습니다'); }
  else {
    S.wish.unshift({id, name:strip(it.title), link:it.link, image:it.image, mall:it.mallName, productId:it.productId, q:query,
      hist:[{d:today(), p:+it.lprice}], target:null});
    toast('찜했습니다 · 오늘 가격을 기록했어요');
  }
  save(); renderResults(); renderWish();
});
const wishId = it => 'n' + (it.productId || strip(it.title));

/* ---------- 찜 · 가격 기록 ---------- */
function spark(h){
  if (h.length < 2) return '';
  const ps = h.map(x=>x.p), lo = Math.min(...ps), hi = Math.max(...ps), W = 300, H = 34, pad = 4;
  const x = i => pad + i*(W-2*pad)/(h.length-1);
  const y = p => hi===lo ? H/2 : pad + (hi-p)*(H-2*pad)/(hi-lo);
  const pts = h.map((v,i)=>`${x(i).toFixed(1)},${y(v.p).toFixed(1)}`).join(' ');
  const last = h[h.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(h.length-1)}" cy="${y(last.p)}" r="3.5" fill="var(--accent)"/></svg>`;
}
function renderWish(){
  const n = S.wish.length;
  $('#wishCount').textContent = n ? n+'개' : '';
  $('#tabBadge').innerHTML = n ? `<span class="badge">${n}</span>` : '';
  $('#lastRefresh').textContent = S.lastRefresh ? '마지막 가격 확인: '+S.lastRefresh : '찜한 상품은 새로고침할 때마다 가격이 기록됩니다';
  if (!n){ $('#wishList').innerHTML = '<div class="note">최저가 목록에서 <b>♡</b>를 누르거나 아래 “직접 찜 추가”로 상품을 넣으면, 가격이 날짜별로 쌓여 지금이 싼 때인지 보여줍니다.</div>'; return; }
  $('#wishList').innerHTML = S.wish.map((w,i)=>{
    const h = w.hist, cur = h[h.length-1].p, first = h[0].p;
    const min = Math.min(...h.map(x=>x.p)), diff = cur - first;
    const hit = w.target && cur <= w.target;
    return `<div class="wcard">
      ${w.image?`<img src="${esc(w.image)}" alt="" loading="lazy">`:'<div class="noimg"></div>'}
      <div style="min-width:0">
        <a class="t" href="${esc(w.link||SITES.naver.url(w.name))}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(w.name)}</a>
        <div class="wrow"><span class="wprice">${won(cur)}</span>
          ${diff?`<span class="delta ${diff<0?'down':'up'}">${diff<0?'▼':'▲'} ${Math.abs(diff).toLocaleString()} (찜할 때 대비)</span>`:''}
          ${cur===min && h.length>1?'<span class="pill hit">기록상 최저</span>':''}
          ${hit?'<span class="pill hit">목표가 도달</span>':''}
          <span class="pill">${esc(w.mall||'')}${w.manual?' · 직접입력':''}</span>
          ${w.missing?'<span class="pill">이번엔 못 찾음</span>':''}
        </div>
      </div>
      ${spark(h)}
      <div class="wfoot">
        <input id="tg${i}" data-target="${i}" inputmode="numeric" placeholder="목표가" value="${w.target||''}" aria-label="목표 가격">
        ${w.manual?`<input id="np${i}" data-newprice="${i}" inputmode="numeric" placeholder="새 가격 입력" aria-label="새 가격">`:''}
        <button class="btn small" data-search="${i}">다시 검색</button>
        <button class="btn small" data-hist="${i}">기록 ${h.length}</button>
        <button class="btn small danger" data-del="${i}">삭제</button>
      </div>
      <div class="hist" id="hist${i}" hidden>${h.slice().reverse().map(x=>`<div><span>${x.d}</span><span class="num">${won(x.p)}</span></div>`).join('')}<div><span>기록상 최저</span><span class="num">${won(min)}</span></div></div>
    </div>`;
  }).join('');
}
$('#wishList').addEventListener('click', e=>{
  const t = e.target;
  if (t.dataset.del!==undefined){
    const i=+t.dataset.del;
    if (t.dataset.confirm){ S.wish.splice(i,1); save(); renderWish(); if(items.length) renderResults(); toast('삭제했습니다'); }
    else { t.dataset.confirm='1'; t.textContent='한 번 더 누르면 삭제'; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.confirm; t.textContent='삭제'; } },3000); }
  }
  if (t.dataset.hist!==undefined){ const el=$('#hist'+t.dataset.hist); el.hidden=!el.hidden; }
  if (t.dataset.search!==undefined){ const w=S.wish[+t.dataset.search]; runSearch(w.q||w.name); }
});
$('#wishList').addEventListener('change', e=>{
  const t = e.target, v = parseInt(String(t.value).replace(/[^\d]/g,''),10);
  if (t.dataset.target!==undefined){ S.wish[+t.dataset.target].target = v||null; save(); renderWish(); toast(v?'목표가를 저장했습니다':'목표가를 지웠습니다'); }
  if (t.dataset.newprice!==undefined && v){ addPrice(S.wish[+t.dataset.newprice], v); save(); renderWish(); toast('오늘 가격을 기록했습니다'); }
});
function addPrice(w, p){
  const d = today(), last = w.hist[w.hist.length-1];
  if (last.d===d) last.p = p; else w.hist.push({d, p});
  if (w.hist.length > 180) w.hist.splice(0, w.hist.length-180);
}

async function refreshAll(auto){
  if (!S.worker){ if(!auto) { toast('설정에서 중계서버를 먼저 연결해 주세요'); } return; }
  const list = S.wish.filter(w=>!w.manual);
  if (!list.length){ if(!auto) toast('자동으로 확인할 찜 상품이 없습니다'); return; }
  const btn = $('#refreshAll'); btn.disabled = true; btn.textContent = '확인 중…';
  let changed = 0, hits = 0;
  for (const w of list){
    try{
      const d = await api(w.name.slice(0,60), {display:100, sort:'sim'});
      const f = (d.items||[]).find(it => w.productId ? it.productId===w.productId : strip(it.title)===w.name);
      if (f){ const before = w.hist[w.hist.length-1].p; addPrice(w, +f.lprice); w.missing=false; if (+f.lprice!==before) changed++; if (w.target && +f.lprice<=w.target) hits++; }
      else w.missing = true;
    }catch(e){ w.missing = true; }
  }
  S.lastRefresh = new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  if (auto) S.lastAuto = today();
  save(); renderWish();
  btn.disabled = false; btn.textContent = '가격 새로고침';
  toast(hits ? `목표가에 도달한 상품이 ${hits}개 있습니다!` : changed ? `가격이 바뀐 상품 ${changed}개` : '가격 변동이 없습니다');
}
$('#refreshAll').addEventListener('click', ()=>refreshAll(false));

$('#manual').addEventListener('submit', e=>{
  e.preventDefault();
  const p = parseInt($('#mPrice').value.replace(/[^\d]/g,''),10); if(!p) return;
  const name = $('#mName').value.trim();
  S.wish.unshift({id:'m'+Date.now(), name, link:$('#mLink').value.trim(), image:'', mall:$('#mMall').value.trim()||'직접입력', manual:true, q:name, hist:[{d:today(),p}], target:null});
  save(); renderWish(); e.target.reset(); toast('찜에 추가했습니다');
});

/* ---------- 설정 ---------- */
function renderSettings(){
  $('#wUrl').value = S.worker; $('#exclude').checked = S.exclude; $('#autoRefresh').checked = S.autoRefresh;
  $('#siteSet').innerHTML = S.sites.map((s,i)=>`<div class="srow">
    <input type="checkbox" class="switch" id="sw_${s.id}" data-on="${i}" ${s.on?'checked':''} aria-label="${SITES[s.id].name} 켜기">
    <span>${SITES[s.id].name} <span class="sub">${SITES[s.id].tag}</span></span>
    <button class="btn small" data-up="${i}" ${i===0?'disabled':''} aria-label="위로">↑</button>
    <button class="btn small" data-down="${i}" ${i===S.sites.length-1?'disabled':''} aria-label="아래로">↓</button></div>`).join('');
}
$('#siteSet').addEventListener('click', e=>{
  const t = e.target, mv = (i,j)=>{ [S.sites[i],S.sites[j]]=[S.sites[j],S.sites[i]]; save(); renderSettings(); renderSites(); };
  if (t.dataset.up!==undefined) mv(+t.dataset.up, +t.dataset.up-1);
  if (t.dataset.down!==undefined) mv(+t.dataset.down, +t.dataset.down+1);
});
$('#siteSet').addEventListener('change', e=>{ const t=e.target; if(t.dataset.on!==undefined){ S.sites[+t.dataset.on].on=t.checked; save(); renderSites(); } });
$('#exclude').addEventListener('change', e=>{ S.exclude=e.target.checked; save(); });
$('#autoRefresh').addEventListener('change', e=>{ S.autoRefresh=e.target.checked; save(); });
$('#wSave').addEventListener('click', async ()=>{
  S.worker = $('#wUrl').value.trim(); save();
  const st = $('#wStatus');
  if (!S.worker){ st.textContent = '주소를 비웠습니다'; return; }
  st.textContent = '확인 중…';
  try{ const d = await api('생수', {display:1}); st.textContent = d.items ? '✓ 연결됐습니다' : '응답은 왔지만 결과가 비어 있습니다'; }
  catch(err){ st.textContent = err.message.startsWith('http40') ? '✗ 네이버 키를 확인하세요' : '✗ 연결 실패 – 주소를 확인하세요'; }
});
$('#exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lowradar-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); toast('백업 파일을 저장했습니다');
});
$('#importFile').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.wish)) throw 0;
    const ids = new Set(S.wish.map(w=>w.id));
    S.wish = S.wish.concat(d.wish.filter(w=>!ids.has(w.id)));
    S.fav = [...new Set([...S.fav, ...(d.fav||[])])];
    if (!S.worker && d.worker) S.worker = d.worker;
    save(); renderAll(); toast('백업을 합쳤습니다');
  }catch(_){ toast('이 파일은 최저가 레이더 백업이 아닙니다'); }
  e.target.value = '';
});

/* ---------- 시작 ---------- */
$('#f').addEventListener('submit', e=>{ e.preventDefault(); runSearch($('#q').value); });
$('#sort').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  sort = b.dataset.s; document.querySelectorAll('#sort button').forEach(x=>x.setAttribute('aria-pressed', x===b));
  if (query){ start=1; loadResults(); }
});
function renderAll(){ renderChips(); renderSites(); renderWish(); if(!query) $('#results').innerHTML = S.worker ? '<div class="empty">검색하면 여러 쇼핑몰 가격이 낮은 순으로 모입니다.</div>' : ''; if(!query && !S.worker) loadResults(); }

// 다른 앱에서 '공유'로 받은 상품명 처리
function fromShare(){
  const p = new URLSearchParams(location.search);
  let t = p.get('q') || [p.get('title'), p.get('text')].filter(Boolean).join(' ');
  if (!t) return '';
  t = t.replace(/https?:\/\/\S+/g,' ').replace(/\[[^\]]*\]|【[^】]*】/g,' ')
       .replace(/(쿠팡|11번가|G마켓|옥션|네이버|무신사|알리익스프레스|테무)(에서|을|를)?\s*(확인|구매|보기|공유)[^\s]*/g,' ')
       .replace(/\s+/g,' ').trim().slice(0,60);
  history.replaceState(null,'',location.pathname);
  return t;
}
renderAll();
const shared = fromShare();
if (shared) runSearch(shared);
if (S.autoRefresh && S.worker && S.lastAuto !== today() && S.wish.some(w=>!w.manual)) setTimeout(()=>refreshAll(true), 800);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
